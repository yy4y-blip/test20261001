<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>おはよう</title>
    <style>
      :root {
        --sun-1: #fff3cc;
        --sun-2: #ffd396;
        --sky-1: #f7b267;
        --sky-2: #f4845f;
        --text: #fffaf0;
        --soft: #fff2dc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
        background: linear-gradient(180deg, #ffd9a8 0%, var(--sky-1) 28%, var(--sky-2) 100%);
        color: var(--text);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          radial-gradient(circle at 50% 12%, rgba(255,255,255,0.95), rgba(255,206,112,0.8) 18%, transparent 30%),
          linear-gradient(180deg, rgba(255,255,255,0.15), rgba(255,255,255,0));
      }

      .card {
        position: relative;
        z-index: 1;
        padding: 60px 80px;
        text-align: center;
        background: rgba(255, 255, 255, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.26);
        border-radius: 26px;
        box-shadow: 0 18px 40px rgba(118, 76, 36, 0.18);
        backdrop-filter: blur(8px);
      }

      h1 {
        margin: 0;
        font-size: clamp(2.8rem, 7vw, 5.8rem);
        letter-spacing: 0.08em;
        color: #fffdf7;
        text-shadow: 0 0 12px rgba(255, 255, 255, 0.6), 0 0 24px rgba(255, 190, 120, 0.5);
      }

      p {
        margin: 18px 0 0;
        font-size: 1rem;
        letter-spacing: 0.14em;
        color: var(--soft);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>おはよう</h1>
      <p>Good morning</p>
    </main>
  </body>
</html>
